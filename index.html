@keyframes asentar { from { opacity: 0; } }

<script>
// Envía la lista de espera a Brevo sin salir de la página y muestra su respuesta (sin JavaScript, el formulario
// también funciona, pero Brevo responde con una página de texto técnico)
const f = document.querySelector('.aviso'), estado = f.querySelector('.estado'), boton = f.querySelector('button');
f.addEventListener('submit', async e => {
  e.preventDefault();
  boton.disabled = true;
  estado.textContent = 'Enviando…';
  try {
    const r = await (await fetch(f.action, { method: 'POST', body: new FormData(f) })).json();
    if (!r.success) throw new Error(r.message);
    estado.textContent = r.message || 'Te hemos enviado un enlace para confirmar tu dirección.';
    f.reset();
  } catch {
    estado.textContent = 'No se ha podido enviar. Inténtalo de nuevo o escríbenos a info@tharp.es.';
  }
  boton.disabled = false;
});
</script>
